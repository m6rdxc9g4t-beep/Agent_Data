name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datamind .
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name dm -p 8501:8501 datamind
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0; sleep 2; done
          docker logs dm; exit 1
