name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datamind .
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name dm -p 3600:3600 datamind
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3600/api/health && exit 0; sleep 2; done
          docker logs dm; exit 1
