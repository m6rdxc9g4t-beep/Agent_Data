# DataMind — configuration Streamlit.
# Thèmes clair et sombre natifs : l'interface suit le réglage du système,
# modifiable dans le menu ⋮ › Settings.

[server]
headless = true
maxUploadSize = 200
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showSidebarNavigation = false
showErrorDetails = "none"

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#4F46E5", "#0EA5E9", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6", "#EC4899", "#64748B"]

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF0F4"
textColor = "#101828"
borderColor = "#E4E7EC"
dataframeBorderColor = "#E4E7EC"
dataframeHeaderBackgroundColor = "#F2F4F7"
codeBackgroundColor = "#F2F4F7"
linkColor = "#4338CA"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
borderColor = "#E4E7EC"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#172033"
textColor = "#E6E9EF"
borderColor = "#243049"
dataframeBorderColor = "#243049"
dataframeHeaderBackgroundColor = "#131B2C"
codeBackgroundColor = "#131B2C"
linkColor = "#A5B4FC"

[theme.dark.sidebar]
backgroundColor = "#0F1522"
secondaryBackgroundColor = "#172033"
borderColor = "#1F2A3C"
