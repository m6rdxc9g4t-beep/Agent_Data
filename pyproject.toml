[project]
name = "datamind"
version = "5.0.0"
description = "DataMind — agent d'analyse de données (Streamlit, Ollama ou Claude)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"datamind/report.py" = ["E501"]
